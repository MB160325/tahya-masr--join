<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>اتحاد طلاب تحيا مصر | نتيجة المقابلة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div id="loader">
      <img id="lg0" alt="" />
      <p>جاري التحميل...</p>
    </div>
    <header>
      <img class="logo" alt="شعار اتحاد طلاب تحيا مصر" />
      <h1>اتحاد طلاب تحيا مصر</h1>
      <p>الاستعلام عن نتيجة المقابلة الشخصية</p>
      <nav class="nav" aria-label="التنقل الرئيسي">
        <a class="nav-btn" href="index.html"
          ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h4" /></svg
          >استمارة الانضمام</a
        >
        <a class="nav-btn active" href="result.html"
          ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" /></svg
          >نتيجة المقابلة</a
        >
        <a class="nav-btn nav-staff" href="index.html#staff"
          ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
          >دخول الفريق</a
        >
      </nav>
    </header>
    <main>
      <section class="card result-card">
        <h2>اعرف نتيجتك</h2>
        <p class="muted">أدخل الرقم القومي الذي سجلت به في الاستمارة (14 رقماً إنجليزياً).</p>
        <div class="bar">
          <input
            id="qid"
            class="ltr"
            inputmode="numeric"
            maxlength="14"
            placeholder="الرقم القومي"
            aria-label="الرقم القومي"
          />
          <button class="btn" id="qbtn" type="button">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" /></svg
            >عرض النتيجة
          </button>
        </div>
        <div id="qres" aria-live="polite"></div>
      </section>
      <p class="center"><a class="text-link" href="index.html">لم تسجل بعد؟ قدّم طلب الانضمام</a></p>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/client.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/result.js"></script>
  </body>
</html>
